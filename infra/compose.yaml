services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: checkout
      POSTGRES_USER: checkout
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Defina POSTGRES_PASSWORD no arquivo infra/.env}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/postgres_data
    healthcheck:
      test: ["CMD", "pg_isready", "-h", "127.0.0.1", "-U", "checkout", "-d", "checkout"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes: 
  postgres_data: