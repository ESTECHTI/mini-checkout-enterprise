name: API CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: checkout_test
          POSTGRES_USER: checkout
          POSTGRES_PASSWORD: checkout_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10

    env:
      SPRING_DATASOURCE_URL: jdbc:postgresql://127.0.0.1:5432/checkout_test
      SPRING_DATASOURCE_USERNAME: checkout
      SPRING_DATASOURCE_PASSWORD: checkout_ci

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Java 21
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
          cache-dependency-path: apps/api/pom.xml

      - name: Run tests and package API
        run: mvn --batch-mode --no-transfer-progress -f apps/api/pom.xml verify
